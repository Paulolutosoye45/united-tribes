# Runs on every push and pull request. Everything that can be checked without real accounts is checked here:
# types, lint, unit tests, the database tests (a real Postgres with every migration applied), a production build,
# and the browser journeys against the stand-in backend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:db
      - name: Production build
        run: npm run build
        env:
          # Placeholders: the build only needs the two public values to exist.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder

  journeys:
    name: Browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install a browser
        run: npx playwright-core install --with-deps chromium
      - name: Run every journey
        run: npm run e2e
      - name: Keep the logs when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: .e2e/logs
          retention-days: 7
